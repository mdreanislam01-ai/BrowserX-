name: Build BrowserX APK
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish a side-by-side preview APK after device checks'
        type: boolean
        default: false
  push:
    paths:
      - 'android/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/device-smoke.sh'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and assemble installable app
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then args+=(-PbrowserxPreview); fi
          set -o pipefail
          if ! gradle "${args[@]}" :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain 2>&1 | tee build.log; then
            echo "::error::$(grep -E '(^e:|^> | FAILED|error:)' build.log | tail -n 16 | cut -c1-300 | tr '\n' ' ')"
            exit 1
          fi
          mkdir -p artifacts
          name="BrowserX-1.1.0-${GITHUB_SHA:0:7}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/$name.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BrowserX-1.1.0-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: device-tests
          path: android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  device-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BrowserX-1.1.0-${{ github.sha }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: test
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the actual APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash source/scripts/device-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BrowserX-device-check
          path: |
            screenshots/
            device.log
            crash.log

  publish:
    needs: device-test
    if: github.ref == 'refs/heads/main' || inputs.publish_preview || contains(github.event.head_commit.message, '[preview-apk]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BrowserX-1.1.0-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: BrowserX-device-check
          path: device-check
      - name: Name the verified build
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag=browserx-v1.1.0; file=BrowserX-1.1.0.apk
          else
            tag="browserx-v1.1.0-preview.$GITHUB_RUN_NUMBER"; file=BrowserX-1.1.0-preview.apk
          fi
          mv BrowserX-*.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: BrowserX³ Android · ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          body: |
            System WebView edition, version 1.1.0 (build 2). Device-checked gesture toolbar, visual tabs, profile workspaces, Link Peek, page trails and offline Reader Studio.
            Branch previews install as **BrowserX³ Preview**, alongside the original app without replacing its data. Debug-signed, not a production signing key.
          files: |
            ${{ steps.package.outputs.file }}
            device-check/screenshots/*.png
