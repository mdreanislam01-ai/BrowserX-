name: Build BrowserX APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Compute build version
        run: |
          commits=$(git rev-list --count HEAD)
          echo "BROWSERX_BUILD=${commits}" >> "$GITHUB_ENV"
          echo "BROWSERX_VERSION_CODE=$((1000 + commits))" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        run: |
          gradle --no-daemon :app:testDebugUnitTest -PbrowserxBuild=$BROWSERX_BUILD --console=plain 2>&1 | tee test.log
          tail -n 15 test.log
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug -PbrowserxBuild=$BROWSERX_BUILD --stacktrace --console=plain > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -n 25 build.log
            errors=$(grep -E -i 'e: file|e: [a-z]|error:|unresolved reference|type mismatch|cannot infer|overload resolution|not enough information' build.log | sed 's#https://[^ ]*##g' | cut -c1-220)
            head_summary=$(printf '%s\n' "$errors" | head -n 10 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            tail_summary=$(printf '%s\n' "$errors" | tail -n 10 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::first errors: $head_summary"
            echo "::error::last errors: $tail_summary"
            exit "$result"
          fi
          tail -n 25 build.log
      - name: Check APK signature
        run: |
          apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | head -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: BrowserX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browserx-latest
          name: BrowserX³ Android APK — latest build
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            Installable BrowserX³ Android APK.

            versionName=1.1.0
            versionCode=${{ env.BROWSERX_VERSION_CODE }}

            Changes in this build:
            - Toolbar (search pill, tab counter, 3-dot menu) sits on top, with the Candy-style
              expand / hide-on-scroll animation.
            - In-app updates: Settings -> About & Updates, or the 3-dot menu, downloads and
              installs the new build without leaving the app.
            - System Back goes to the previous page, then to the home page, then leaves the app.
            - Page-load errors show a Retry card; downloads work on Android 6-9 as well.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true

  device-test:
    needs: build
    runs-on: ubuntu-latest
    # Extra safety net: a red emulator job should not block the APK release above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Smoke test the real APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest --console=plain > test.log 2>&1
            status=$?
            echo "::error::connectedAndroidTest exit=$status"
            tail -n 50 test.log | cut -c1-600 | sed 's/%/%25/g' | sed 's/^/::error::gradle /'
            adb logcat -d -s AndroidRuntime:E | tail -n 30 | cut -c1-500 | sed 's/%/%25/g' | sed 's/^/::error::logcat /'
            exit $status
      - name: Surface test failures
        if: always()
        run: |
          for f in $(find android/app/build -path '*androidTest-results*' -name '*.xml' | head -n 6); do
            echo "--- $f"
            grep -E '<testcase|<failure|<error' "$f" | cut -c1-700 | sed 's/%/%25/g' | sed 's/^/::error::/'
          done
