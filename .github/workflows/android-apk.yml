name: Build BrowserX APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and assemble installable app
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then args+=(-PbrowserxPreview); fi
          gradle "${args[@]}" :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          mkdir -p artifacts
          name="BrowserX-1.1.0-${GITHUB_SHA:0:7}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/$name.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BrowserX-1.1.0-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: device-tests
          path: android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  device-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BrowserX-1.1.0-${{ github.sha }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the actual APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ID: ${{ github.ref == 'refs/heads/main' && 'com.browserx.app' || 'com.browserx.app.preview' }}
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install apk/*.apk
            adb install test/*.apk
            adb shell am instrument -w "$APP_ID.test/androidx.test.runner.AndroidJUnitRunner" | tee device.log
            adb pull "/sdcard/Android/data/$APP_ID/files/smoke" screenshots || true
            grep -Eq '^OK \([1-9][0-9]* tests?\)' device.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BrowserX-device-check
          path: |
            screenshots/
            device.log

  publish:
    needs: device-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BrowserX-1.1.0-${{ github.sha }}
      - run: mv BrowserX-*.apk BrowserX-1.1.0.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: browserx-v1.1.0
          name: BrowserX³ Android v1.1.0
          target_commitish: ${{ github.sha }}
          body: |
            System WebView edition, version 1.1.0 (build 2). Gesture toolbar, local commands, visual tab overview, per-profile sessions, favorites, Link Peek and page trails.
            This is a debug-signed APK. Branch previews have a separate application ID and never overwrite this release.
          files: BrowserX-1.1.0.apk
